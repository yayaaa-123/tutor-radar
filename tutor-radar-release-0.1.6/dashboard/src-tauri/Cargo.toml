[package]
name = "tutor-radar"
version = "0.1.0"
description = "Local tutor order monitor"
authors = ["Tutor Radar"]
edition = "2021"

[lib]
name = "tutor_radar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
