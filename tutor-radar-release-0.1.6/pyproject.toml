[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tutor-monitor"
version = "0.1.0"
description = "Read-only local tutor-order monitor"
requires-python = ">=3.11"
dependencies = ["requests>=2.32,<3"]

[project.optional-dependencies]
wechat = ["wechatauto-replica==1.1.9"]
dev = ["pytest>=8.3"]

[project.scripts]
tutor-monitor = "tutor_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
